uri:
  amex:
    base: http://localhost:8081
    billing: /v1/billing
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,heapdump
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
